name: Build Desktop Installers

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Frontend Dependencies
        run: npm --prefix apps/web install

      - name: Build Web Application
        run: npm --prefix apps/web run build

      - name: Install Desktop Dependencies
        run: npm --prefix apps/desktop install

      - name: Build macOS Installer (.dmg & .zip)
        if: matrix.os == 'macos-latest'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm --prefix apps/desktop run dist:mac

      - name: Build Windows Installer (.exe & portable)
        if: matrix.os == 'windows-latest'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm --prefix apps/desktop run dist:win

      - name: Verify Installer Artifacts (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          ls -la apps/desktop/dist-electron
          test -f apps/desktop/dist-electron/*.dmg || ls apps/desktop/dist-electron/*.dmg
          test -f apps/desktop/dist-electron/*.zip || ls apps/desktop/dist-electron/*.zip

      - name: Verify Installer Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Get-ChildItem -Path "apps/desktop/dist-electron"
          if (-not (Get-ChildItem "apps/desktop/dist-electron/*.exe")) {
            throw "Windows installer executable not found!"
          }

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Axiom-Desktop-${{ matrix.os }}
          path: |
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.zip
            apps/desktop/dist-electron/*.exe
          if-no-files-found: error
