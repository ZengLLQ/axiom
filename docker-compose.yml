services:
  api:
    image: julia:1.11
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    command: >
      julia -e 'using Pkg; Pkg.add(["HTTP", "JSON3", "SQLite", "ForwardDiff", "Zygote", "Lux", "ComponentArrays", "Optimisers", "DBInterface"]); include("services/api/src/AxiomAPI.jl")'
    environment:
      - PORT=8080

  web:
    image: node:20-alpine
    working_dir: /app/apps/web
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api
